<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iano">Em que ano você nasceu?</label>
            <input oninput="calcIdade()" type="number" name="ano" id="iano" min="1900" max="2026" required value="2000">
        </p>
        <p>
            <label for="iidade">Sua idade nesse ano vai ser: </label>
            <output id="iidade" ">0</output>
        </p>
        <p>
            <input type="submit"value="Enviar">
            <input type="reset" value="Reset">
        </p>
    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }

    </script>
    <data value=""></data>
</body>
</html>
