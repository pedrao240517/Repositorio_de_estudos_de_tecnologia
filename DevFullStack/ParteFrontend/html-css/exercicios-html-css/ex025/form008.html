<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="in1">Número 1: </label>
            <input oninput="soma.innerHTML = Number(in1.value) + Number(in2.value)" type="number" name="num1" id="in1" min="0" max="50" required>
        </p>
        <p>
            <label for="in2">Número 2: </label>
            <input oninput="soma.innerHTML = Number(in1.value) + Number(in2.value)" type="number" name="num2" id="in2" min="0" max="50" required>
        </p>
        <label for="soma">Soma: </label>
        <output id="soma" name="soma">0</output>
        <p>
            <input type="submit"value="Enviar">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
