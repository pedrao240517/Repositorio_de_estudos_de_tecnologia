<html lang="pt-br">
<head>

    <title>Desafio Austronauta</title>
    <style>
        body{ 
            margin: 0;
        }
        #container {
            background-image: url(imagens/espaco.jpg);
            position: relative;
            width: 100vw; 
             height: 100vh; 
            background-size: cover; 
            background-position: center; /
            background-repeat: no-repeat; 
        }
        #conteudo{ 
             background-image: url(imagens/astronauta.png);
            background-size: 100% 100%;
            position: absolute;
            height: 400px;
            width: 400px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); 

        }


    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
