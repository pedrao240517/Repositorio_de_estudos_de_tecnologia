<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas </title>
    <style>
        @font-face {
            font-family: 'love';
            src: url('fontes/CHERL___.TTF')format('opentype');

            font-weight: normal;
            font-style:normal ;
        } 

        /*
            Tipos de format()
            *opentrype(otf)
            *truetype(ttf)
            *enbedded-opentype
            *truetype-att(Apple-advanced Typograph)
            *svg
        */

        body {
            font-family: love, Helvetica, sans-serif;
        }

        h1 {
            font-family: love, Times, serif;
            font-style: normal;
        }

    </style>
</head>
<body>
    <h1>Título</h1>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti provident similique laborum vitae sapiente molestiae atque aut, rem, expedita dolorem blanditiis eos sunt possimus dolor illo perferendis? Ullam, hic perferendis!</p>
    
</body>
</html>
